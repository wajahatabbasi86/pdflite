# Project-wide Gradle settings.

# The default heap (512MB) is too small for an Android + Compose build and causes
# GC thrashing / daemon expiry. 4GB heap / 1GB metaspace is a reasonable baseline;
# lower if your machine has less RAM available, raise if you still see thrashing.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# AndroidX / Jetifier
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enable Gradle build cache and parallel execution for faster builds.
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
